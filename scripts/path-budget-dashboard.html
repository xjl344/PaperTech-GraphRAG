<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>路径配额三组对照</title><style>body{font:15px/1.7 system-ui,"Microsoft YaHei";max-width:1400px;margin:auto;padding:24px;background:#f5f7fb;color:#23354d}section{background:white;padding:20px;margin:18px 0;border:1px solid #d9e1ec;border-radius:8px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}.bar{height:17px;margin:4px 0 12px;background:#287da6}table{width:100%;border-collapse:collapse}th,td{padding:8px;text-align:left;border-bottom:1px solid #ddd}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:550px;overflow:auto;background:#f4f6f9;padding:12px}button,input{font:inherit;padding:5px}summary{cursor:pointer}@media(max-width:850px){.grid{grid-template-columns:1fr}}</style>
<h1>路径配额：0 / 800 / 1200</h1><p id="run"></p><nav id="links"></nav><p>总额 6000 字节；0 保持原文优先并允许路径使用剩余空间，800/1200 从总额预留路径配额。候选与分数固定，答案重新生成。事实覆盖和来源齐全不是语义正确率；时延为本轮组装、生成及引用校验，不含新检索。</p>
<section><h2>汇总指标与柱状图</h2><div id="charts" class="grid"></div><pre id="basic"></pre></section>
<section><h2>分类指标</h2><pre id="categories"></pre></section>
<section><h2>16 题逐题对照</h2><input id="search" placeholder="筛选题号或问题"><div style="overflow:auto"><table><thead><tr><th>题号 / 问题</th><th>事实覆盖 0/800/1200</th><th>来源齐全</th><th>路径数</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section>
<section id="detail"><h2>选择题目查看完整结果</h2></section>
<script>const D=__DATA__,A=Object.keys(D.arms),$=id=>document.getElementById(id),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const B=(title,v,open=false)=>'<details'+(open?' open':'')+'><summary>'+E(title)+'</summary><pre>'+E(JSON.stringify(v,null,2))+'</pre></details>';
$('run').textContent=D.benchmark+' · '+D.run_id+' · '+D.status+' · SHA-256 '+D.benchmark_sha256;
$('links').innerHTML='<a href="report.md">文字报告</a> · <a href="comparison.json">全部对照 JSON</a> · <a href="per-question-diagnosis.json">逐题归因 JSON</a>'+(D.dataset_sync.comparison_url?' · <a href="'+E(D.dataset_sync.comparison_url)+'">LangSmith 三组对照</a>':'');
const fields=[['冻结事实覆盖','evidence_coverage'],['必要来源齐全题数','all_required_papers'],['平均原文块数','evidence_count'],['平均路径字节','path_bytes'],['有路径题数','queries_with_paths'],['全部事实覆盖题数','all_units'],['组装 P95 毫秒','assembly_p95_ms'],['生成含校验 P95 秒','generation_p95_seconds'],['本轮请求 P95 秒（不含检索）','measured_request_p95_seconds'],['输入 Token','input_tokens'],['输出 Token','output_tokens']];
$('charts').innerHTML=fields.map(([label,k])=>{const max=Math.max(.000001,...A.map(a=>D.aggregates[a][k]??0));return '<div><b>'+E(label)+'</b>'+A.map((a,i)=>{let v=D.aggregates[a][k];return '<div>'+a+'：'+(v==null?'未运行':k==='evidence_coverage'?(100*v).toFixed(2)+'%':v.toFixed(3))+'</div><div class="bar" style="background:'+['#287da6','#d28136','#528547'][i]+';width:'+(100*(v??0)/max)+'%"></div>'}).join('')+'</div>'}).join('');
$('basic').textContent=JSON.stringify({coverage_changes:D.fact_coverage_changes,statuses:Object.fromEntries(A.map(a=>[a,D.aggregates[a].statuses])),generated:Object.fromEntries(A.map(a=>[a,D.aggregates[a].generated])),unknown_usage:Object.fromEntries(A.map(a=>[a,D.aggregates[a].unknown_usage]))},null,2);
$('categories').textContent=JSON.stringify(D.categories,null,2);
function render(){const q=$('search').value.toLowerCase();$('rows').innerHTML=Object.entries(D.results).filter(([id,p])=>(id+' '+p[A[0]].question).toLowerCase().includes(q)).map(([id,p])=>'<tr><td>'+id+'<br>'+E(p[A[0]].question)+'</td><td>'+A.map(a=>(100*p[a].metrics.evidence_coverage).toFixed(1)+'%').join(' / ')+'</td><td>'+A.map(a=>p[a].source_metrics.all_required_papers?'是':'否').join(' / ')+'</td><td>'+A.map(a=>p[a].generation_paths.length).join(' / ')+'</td><td><button data-id="'+id+'">查看详情</button></td></tr>').join('');$('rows').querySelectorAll('button').forEach(b=>b.onclick=()=>show(b.dataset.id))}
function show(id){let html='<h2>'+id+'</h2>'+B('参考答案、必要事实、全部参考原文与位置、评分规则',D.references[id],true)+B('三组证据增减、来源与事实差异、路径未入选原因',D.diagnostics[id],true)+'<div class="grid">';for(const arm of A){const r=D.results[id][arm];html+='<div><h3>'+arm+'</h3>'+B('完整回答、状态、引用与 Token',{answer:r.answer,status:r.status,citations:r.citations,usage:r.usage,model_name:r.model_name},true)+B('逐事实支持和缺口',{coverage:r.fact_coverage,missing:r.missing_required_facts},true)+B('原文与定位',r.evidence)+B('预算、来源与路径拒绝原因',{retrieval_summary:r.retrieval_summary,source_metrics:r.source_metrics,path_diagnostics:r.path_diagnostics})+B('原始图路径',r.graph_paths)+B('实际生成路径',r.generation_paths)+B('全部候选与排序分数',r.ranked_candidates)+B('耗时、调用、错误与未校验草稿',{assembly_seconds:r.assembly_seconds,generation_seconds:r.generation_seconds,stage_timings:r.stage_timings,provider_calls:r.provider_calls,errors:r.errors,unvalidated_draft:r.unvalidated_draft})+'<a href="'+E(r.candidate_snapshot)+'">检索候选阶段快照</a><br>'+(r.trace_url?'<a href="'+E(r.trace_url)+'">本轮回答 Trace</a><br>':'')+'<a href="'+E(r.retrieval_trace_url)+'">父运行检索 Trace</a></div>'}html+='</div>';$('detail').innerHTML=html;$('detail').scrollIntoView({behavior:'smooth'})}
$('search').oninput=render;render();</script></html>
